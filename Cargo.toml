[package]
name = "iml"
version = "0.1.0"
authors = ["Ivan Temchenko <[ivan.vb030@simplelogin.com]>"]
description = "Inverted Microledger"
license = "Licensed under the EUPL-1.2-or-later"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
k256 = { version = "^0.13", features = [ "ecdsa", "serde", "ecdh" ] }
static-dh-ecdh = "0.1.1"
crypto_secretbox = "0.1.1"
blake3 = "1.2.0"
libflate = "^2.0"
zeroize = "^1.8"
rand = "^0.8"
thiserror = "^1"
arrayref = "0.3.7"
hex = "0.4.3"

wasm-bindgen = { version = "0.2.95", optional = true }

[features]
default = []
wasm-gen = ["wasm-bindgen"]
